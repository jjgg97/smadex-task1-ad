<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Royal Match - Mobile Ad Carousel</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="ad" role="region" aria-label="Royal Match mobile ad">
    <header class="ad__header">
      <img class="ad__logo" src="assets/logo.png" alt="Royal Match" />
      <h1 class="ad__headline">Rescue the King. Match & Win!</h1>
    </header>

    <section class="ad__hero">
      <img class="ad__frame" src="assets/frame.png" alt="" aria-hidden="true"/>
      <div class="carousel" aria-roledescription="carousel" aria-label="Game previews">
        <div class="carousel__track" id="track">
          <article class="slide slide--image" aria-label="Stuck Under Rocks">
            <img src="assets/slide_rocks.png" alt="The king is stuck under rocks as pieces are matched below" />
            <div class="slide__caption">Clear the Board</div>
          </article>
          <article class="slide slide--image" aria-label="Hold The Rock">
            <img src="assets/slide_hold.png" alt="Hold the rock while matching tiles to save the king" />
            <div class="slide__caption">Beat the Clock</div>
          </article>
          <article class="slide slide--image" aria-label="Rock Stop by Lava">
            <img src="assets/slide_lava.png" alt="Stop the rocks and avoid the lava to rescue the king" />
            <div class="slide__caption">Rescue the King</div>
          </article>
        </div>
        <div class="dots" role="tablist" aria-label="Slides">
          <button class="dot is-active" role="tab" aria-selected="true"></button>
          <button class="dot" role="tab" aria-selected="false"></button>
          <button class="dot" role="tab" aria-selected="false"></button>
        </div>
      </div>
    </section>

    <footer class="ad__footer">
      <a class="cta" href="#" role="button" aria-label="Play now">
        <img src="assets/BUTTON.png" alt="Play Now!" />
      </a>
      <p class="fine">Free to play • In-app purchases • 4.7★</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
